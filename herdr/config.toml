onboarding = false
# herdr configuration
# See: herdr --default-config

[keys]
next_workspace = "prefix+j"
previous_workspace = "prefix+k"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
navigate_workspace_down = "j"
navigate_workspace_up = "k"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true

[theme]
name = "dracula"
auto_switch = false
